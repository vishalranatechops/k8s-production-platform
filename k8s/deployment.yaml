apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: order-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-api
  
  template:
    metadata:
      labels:
        app: order-api

    spec:
      containers:
        - name: order-api
          image: order-api:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
